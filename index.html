<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Student API</title>

    <style>

        body {
            font-family: Arial;
            width: 700px;
            margin: 40px auto;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
        }

    </style>

</head>


<body>

    <h1>Student Management</h1>


    <!-- ================================ -->
    <!-- INSERT -->
    <!-- ================================ -->

    <h2>Add Student</h2>

    <input
        type="text"
        id="name"
        placeholder="Name"
    >

    <input
        type="text"
        id="course"
        placeholder="Course"
    >

    <input
        type="number"
        id="yearLevel"
        placeholder="Year Level"
    >

    <button onclick="addStudent()">
        Add Student
    </button>


    <!-- ================================ -->
    <!-- RETRIEVE -->
    <!-- ================================ -->

    <h2>Students</h2>

    <button onclick="loadStudents()">
        Load Students
    </button>


    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Year Level</th>
            </tr>

        </thead>

        <tbody id="studentTable">

        </tbody>

    </table>


    <script>


        // ========================================
        // GET - Retrieve Students
        // ========================================

        async function loadStudents() {

            const response =
                await fetch("/api/students");


            const students =
                await response.json();


            const table =
                document.getElementById(
                    "studentTable"
                );


            table.innerHTML = "";


            students.forEach(student => {

                const row = `
                    <tr>

                        <td>${student.id}</td>

                        <td>${student.name}</td>

                        <td>${student.course}</td>

                        <td>${student.year_level}</td>

                    </tr>
                `;


                table.innerHTML += row;

            });

        }


        // ========================================
        // POST - Insert Student
        // ========================================

        async function addStudent() {

            const name =
                document.getElementById(
                    "name"
                ).value;


            const course =
                document.getElementById(
                    "course"
                ).value;


            const year_level =
                document.getElementById(
                    "yearLevel"
                ).value;


            const student = {

                name: name,

                course: course,

                year_level: year_level

            };


            const response =
                await fetch(
                    "/api/students",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(student)

                    }
                );


            const result =
                await response.json();


            alert(result.message);


            // Clear inputs

            document.getElementById(
                "name"
            ).value = "";

            document.getElementById(
                "course"
            ).value = "";

            document.getElementById(
                "yearLevel"
            ).value = "";


            // Refresh list

            loadStudents();

        }


        // Load students when page opens
        loadStudents();

    </script>

</body>

</html>
